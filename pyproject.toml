[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-font-recovery"
version = "0.1.0"
description = "Deterministically extract, repair and verify fonts embedded in PDF documents."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["fonts", "pdf", "opentype", "cff", "subsetting", "typography"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Fonts",
]
dependencies = [
    "fonttools>=4.50",
    "pymupdf>=1.24",
    "pillow>=10.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
pdf-font-recovery = "pdf_font_recovery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pdf_font_recovery*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
